[project]
name = "pipeline-dados"
version = "0.1.0"
description = "Pipeline de dados com Airflow, DBT, Streamlit e PostgreSQL"
authors = [
    {name = "Wendel", email = "delldev7@gmail.com"}
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
pandas = ">=2.2.3,<3.0.0"
pyarrow = ">=10.0.1,<10.1.0"
requests = ">=2.32.3,<3.0.0"
streamlit = "^1.45.0"
python-dotenv = "^1.1.0"
cryptography = "^44.0.2"
httpx = "^0.28.1"
sqlalchemy = ">=1.4.28,<2.0"
psycopg2-binary = ">=2.9.10"


[tool.poetry.dev-dependencies]
pytest = "^7.4"
black = "^24.3"
isort = "^6.0"
mypy = "^1.5"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
