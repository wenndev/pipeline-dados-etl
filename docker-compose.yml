x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: pipeline-airflow:2.10.3-python3.11
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
    AIRFLOW_UID: ${AIRFLOW_UID}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    PYTHONPATH: /opt/airflow/src
    DATA_DIR: /opt/airflow/data
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - project_network

services:
  # -------------------
  # Postgres
  # -------------------
  postgres:
    image: postgres:16-alpine
    container_name: pipeline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - project_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------
  # pgAdmin
  # -------------------
  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: pipeline_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - project_network

  # -------------------
  # Airflow Init
  # -------------------
  airflow-init:
    <<: *airflow-common
    container_name: pipeline_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "⏳ Waiting for Postgres..." &&
        sleep 10 &&
        airflow db upgrade &&
        airflow users create \
          --role Admin \
          --username ${AIRFLOW_USER_USERNAME} \
          --password ${AIRFLOW_USER_PASSWORD} \
          --email ${AIRFLOW_USER_EMAIL} \
          --firstname Admin \
          --lastname User

  # -------------------
  # Airflow Webserver
  # -------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: pipeline_airflow_webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # -------------------
  # Airflow Scheduler
  # -------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: pipeline_airflow_scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # -------------------
  # DBT
  # -------------------
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.0
    container_name: pipeline_dbt
    working_dir: /app/dbt
    volumes:
      - ./dbt:/app/dbt
      - ./dbt/logs:/app/dbt/logs
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - project_network
    entrypoint: []
    command: ["sleep", "infinity"]

  # -------------------
  # Streamlit
  # -------------------
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POETRY_VERSION: ${POETRY_VERSION}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    container_name: pipeline_streamlit
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PYTHONPATH: /app/src
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./streamlit_app:/app/streamlit_app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - project_network
    command: ["streamlit", "run", "streamlit_app/app.py", "--server.port=8501", "--server.address=0.0.0.0"]

# -------------------
# Volumes
# -------------------
volumes:
  postgres_data:
    name: pipeline_postgres_data
  pgadmin_data:
    name: pipeline_pgadmin_data
  airflow_data:
    name: pipeline_airflow_data

# -------------------
# Networks
# -------------------
networks:
  project_network:
    name: pipeline_network
    driver: bridge
